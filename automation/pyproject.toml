[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iot-experiment-automation"
version = "0.1.0"
description = "Cross-platform vendor-app automation and traffic capture orchestration"
requires-python = ">=3.10,<3.14"
dependencies = [
  "Appium-Python-Client>=6.0,<7.0",
  "fastapi>=0.115,<1.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.30,<1.0",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
iot-exp = "iot_exp.cli:main"
iot-exp-gui = "iot_exp.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_exp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
