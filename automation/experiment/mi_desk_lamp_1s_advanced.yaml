# 米家台灯 1S 增强版：亮度 / 色温 / 六种情景模式 / 专注模式 参数化实验
#
# 选择器与滑块轨道校准来源：2026-09-24 真机（米家 11.8.703，LG LM-V405）只读页面检查
# 与最小真机闭环（会话 advanced_real_001..003），证据存于 doc/desk-lamp-page-evidence/。
# 已核实：亮度 [1,100]%、色温约 [2600,5100]K、六个情景按钮文字、专注开关 checked 属性。
# 已知限制：情景"当前选中"标记在本 App 版本不可机器读取（情景回执诚实记为 timeout）；
# 情景模式会接管手动滑块，不建议与亮度/色温事件同会话混跑。详见 automation/README.md 10.2。
experiment_id: mi_desk_lamp_1s_advanced_v1
adapter: mi_home_desk_lamp_1s
phone:
  phone_id: android_phone_01
  udid: REPLACE_WITH_ADB_UDID
  network: public_wifi
  experiment_network_forbidden: true
app:
  vendor: xiaomi
  package: com.xiaomi.smarthome
  version: 11.8.703
  selectors:
    device_entry:
      # 列表卡片描述为"米家台灯1S 增强版宿舍60%已开启 "，须用包含匹配。
      - {strategy: description_contains, value: "米家台灯1S 增强版"}
      - {strategy: text, value: "台灯1S 增强版"}
    device_page_marker:
      # 设备名文字在二级设置页也会出现；电源按钮文字只在设备页存在。
      - {strategy: text, value: "关灯"}
      - {strategy: text, value: "开灯"}
    scene_area_marker:
      - {strategy: text, value: "我的模式"}
    dismiss_popup:
      - {strategy: text, value: "取消"}
    power_toggle: []
    state_on:
      - {strategy: text, value: "关灯"}
    state_off:
      - {strategy: text, value: "开灯"}
    turn_on:
      - {strategy: text, value: "开灯"}
    turn_off:
      - {strategy: text, value: "关灯"}
    brightness_value:
      - {strategy: text_matches, value: "\\d+%"}
    color_temperature_value:
      - {strategy: text_matches, value: "\\d+K"}
    brightness_slider:
      - {strategy: xpath, value: "//android.view.ViewGroup[.//android.widget.TextView[@text='亮度']]"}
    color_temperature_slider:
      - {strategy: xpath, value: "//android.view.ViewGroup[.//android.widget.TextView[@text='色温']]"}
    scene_电脑模式_button:
      - {strategy: text, value: "电脑模式"}
    scene_温馨模式_button:
      - {strategy: text, value: "温馨模式"}
    scene_休闲模式_button:
      - {strategy: text, value: "休闲模式"}
    scene_办公模式_button:
      - {strategy: text, value: "办公模式"}
    scene_阅读模式_button:
      - {strategy: text, value: "阅读模式"}
    scene_娱乐模式_button:
      - {strategy: text, value: "娱乐模式"}
    focus_entry:
      - {strategy: description_contains, value: "更多设置"}
    focus_page_marker:
      - {strategy: text, value: "设备设置"}
    focus_switch:
      - strategy: android_uiautomator
        value: 'new UiSelector().descriptionContains("专注模式").childSelector(new UiSelector().checkable(true))'
device:
  device_id: desk_lamp_1s
  display_name: 米家台灯1S 增强版
  entity_id: null
  firmware: REPLACE_WITH_FIRMWARE_VERSION
network:
  forbidden_cidrs: [192.168.1.0/24]
  target_device_ip: null
  require_no_usb_tethering: true
sessions:
  count: 1
  repetitions_per_event: 1
  idle_range_seconds: [1, 3]
  cooldown_seconds: 1
  max_attempts: 2
  parameter_ack_timeout_seconds: 15
parameters:
  # 轨道像素为 2026-09-24 真机校准值（LM-V405，1440px 宽，米家 11.8.703，
  # 会话 advanced_real_001 的前后读值证据）；换机或升级 App 后须重新校准。
  brightness:
    range: [1, 100]
    unit: "%"
    tolerance: 3
    track_start_px: 142
    track_end_px: 1179
  color_temperature:
    range: [2600, 5100]
    unit: "K"
    tolerance: 100
    track_start_px: 142
    track_end_px: 1179
  scene:
    scenes: [电脑模式, 温馨模式, 休闲模式, 办公模式, 阅读模式, 娱乐模式]
    # 2026-09-25 真机逐一选择后的 App 亮度/色温回读；用于无截图情景判定。
    presets:
      电脑模式: {brightness: 50, color_temperature: 2700}
      温馨模式: {brightness: 60, color_temperature: 3500}
      休闲模式: {brightness: 50, color_temperature: 4000}
      办公模式: {brightness: 100, color_temperature: 4500}
      阅读模式: {brightness: 100, color_temperature: 5000}
      娱乐模式: {brightness: 80, color_temperature: 3000}
events:
  - {event_type: set_brightness, target: 30}
  - {event_type: set_brightness, target: 80}
  - {event_type: set_color_temperature, target: 3200}
  - {event_type: set_color_temperature, target: 4600}
  - {event_type: select_scene, target: 电脑模式}
  - {event_type: select_scene, target: 温馨模式}
  - {event_type: select_scene, target: 休闲模式}
  - {event_type: select_scene, target: 办公模式}
  - {event_type: select_scene, target: 阅读模式}
  - {event_type: select_scene, target: 娱乐模式}
  - {event_type: set_focus_mode, target: true}
  - {event_type: set_focus_mode, target: false}
